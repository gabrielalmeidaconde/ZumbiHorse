# Teste manual (aba Actions > "Testar chave do itch.io" > Run workflow): confere se a BUTLER_API_KEY vale
# e mostra de qual conta do itch.io ela é. Não publica nada.
name: Testar chave do itch.io

on: workflow_dispatch

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir BUTLER_API_KEY
        env:
          KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::A BUTLER_API_KEY não está cadastrada"; exit 1; fi
          resp=$(curl -s -H "Authorization: $KEY" https://api.itch.io/profile)
          user=$(echo "$resp" | python3 -c "import json,sys; print(json.load(sys.stdin).get('user', {}).get('username', ''))")
          if [ -z "$user" ]; then echo "::error::O itch.io recusou a chave: $resp"; exit 1; fi
          echo "Chave OK: conta do itch.io = $user"
          if [ -z "$ITCH_GAME" ]; then echo "::notice::Falta a variável ITCH_GAME (ex.: $user/nome-do-jogo)"; else echo "ITCH_GAME = $ITCH_GAME"; fi
