# Teste manual (aba Actions > "Testar chave do itch.io" > Run workflow): confere se a BUTLER_API_KEY vale
# e mostra de qual conta do itch.io ela é. Não publica nada.
name: Testar chave do itch.io

on: workflow_dispatch

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir BUTLER_API_KEY
        env:
          KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::A BUTLER_API_KEY não está cadastrada"; exit 1; fi
          clean=$(printf '%s' "$KEY" | tr -d '[:space:]')
          [ "$clean" != "$KEY" ] && echo "::warning::A chave cadastrada tinha espaços ou quebra de linha (o build vai limpar isso)"
          echo "Tamanho da chave: ${#clean} caracteres"
          name() { python3 -c "import json,sys; print(json.load(sys.stdin).get('user', {}).get('username', ''))" 2>/dev/null; }
          user=$(curl -s "https://itch.io/api/1/$clean/me" | name); how="api/1/KEY/me"
          [ -z "$user" ] && { user=$(curl -s -H "Authorization: $clean" https://api.itch.io/profile | name); how="Authorization: KEY"; }
          [ -z "$user" ] && { user=$(curl -s -H "Authorization: Bearer $clean" https://api.itch.io/profile | name); how="Authorization: Bearer KEY"; }
          if [ -z "$user" ]; then echo "::error::O itch.io recusou a chave nos três formatos (chave errada ou revogada?)"; exit 1; fi
          echo "Chave OK ($how): conta do itch.io = $user"
          if [ -z "$ITCH_GAME" ]; then echo "::notice::Falta a variável ITCH_GAME (ex.: $user/nome-do-jogo)"; else echo "ITCH_GAME = $ITCH_GAME"; fi
